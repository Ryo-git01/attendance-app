<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#68785a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="勤怠管理">
  <title>勤怠管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="homeScreen" class="screen active">
      <div class="home-content">
        <div class="action-row">
          <button id="clockInBtn" class="action-btn">出勤</button>
          <button id="clockOutBtn" class="action-btn" disabled>退勤</button>
        </div>

        <div id="stampDisplay" class="stamp-display" aria-live="polite"></div>

        <button id="attendanceBtn" class="attendance-btn">勤怠確認</button>
      </div>
    </section>

    <section id="attendanceScreen" class="screen">
      <header class="screen-header">
        <button id="backBtn" class="back-btn" aria-label="戻る">‹</button>
        <h1>勤怠確認</h1>
        <div class="header-spacer"></div>
      </header>

      <div class="month-tabs" id="monthTabs"></div>

      <div class="table-wrap">
        <table class="attendance-table">
          <thead>
            <tr>
              <th>日付</th>
              <th>出勤</th>
              <th>退勤</th>
              <th>休憩</th>
              <th>実働</th>
            </tr>
          </thead>
          <tbody id="attendanceBody"></tbody>
        </table>
        <div id="emptyMessage" class="empty-message">記録はありません</div>
      </div>

      <div class="edit-area">
        <button id="editBtn" class="secondary-btn">編集</button>
        <button id="salaryBtn" class="secondary-btn salary-open-btn">給与計算</button>
      </div>
    </section>

    <section id="salaryScreen" class="screen">
      <header class="screen-header">
        <button id="salaryBackBtn" class="back-btn" aria-label="戻る">‹</button>
        <h1>給与計算</h1>
        <div class="header-spacer"></div>
      </header>
      <div class="salary-content">
        <div class="salary-total">
          <div id="salaryMonthLabel" class="salary-month-label">10月分</div>
          <div class="salary-total-label">総支給額（概算）</div>
          <div id="grossPay" class="gross-pay">0円</div>
        </div>
        <div class="salary-summary">
          <div class="salary-stat"><div class="salary-stat-label">出勤日数</div><div id="attendanceDays" class="salary-stat-value">0日</div></div>
          <div class="salary-stat"><div class="salary-stat-label">総労働時間</div><div id="totalWorkHours" class="salary-stat-value">0時間</div></div>
          <div class="salary-stat"><div class="salary-stat-label">所定労働時間</div><div id="scheduledWorkHours" class="salary-stat-value">0時間</div></div>
          <div class="salary-stat"><div class="salary-stat-label">残業60時間まで</div><div id="overtimeUnder60Hours" class="salary-stat-value">0時間</div><div id="overtimeUnder60" class="salary-stat-pay">0円</div></div>
          <div class="salary-stat"><div class="salary-stat-label">残業60時間超</div><div id="overtimeOver60Hours" class="salary-stat-value">0時間</div><div id="overtimeOver60" class="salary-stat-pay">0円</div></div>
          <div class="salary-stat"><div class="salary-stat-label">交通費</div><div id="transportPay" class="salary-stat-value">0円</div></div>
        </div>
        <div class="salary-rate-row">
          <div><div class="salary-rate-label">残業元単価</div><div id="baseRateDisplay" class="salary-rate-value">1,402円</div></div>
          <button id="settingsBtn" class="secondary-btn">単価設定</button>
        </div>
        <p class="salary-note">※概算表示です。休日出勤の割増計算は含みません。</p>
      </div>
    </section>
  </main>

  <!-- 休憩時間入力 -->
  <div id="breakModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="breakTitle">
      <h2 id="breakTitle">休憩時間</h2>
      <div class="number-input-row">
        <input id="breakInput" type="number" inputmode="numeric" min="0" step="1" value="0" aria-label="休憩時間">
        <span>分</span>
      </div>
      <button id="registerBtn" class="primary-btn">登録</button>
    </div>
  </div>

  <div id="settingsModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-settings="true"></div>
    <div class="modal-card settings-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <h2 id="settingsTitle">単価設定</h2>
      <label class="setting-field"><span>残業元単価（円）</span><input id="rateSetting" type="number" inputmode="decimal" min="0" step="0.01"></label>
      <label class="setting-field"><span>手当（円）</span><input id="allowanceSetting" type="number" inputmode="numeric" min="0" step="1"></label>
      <label class="setting-field"><span>交通費（円／日）</span><input id="transportSetting" type="number" inputmode="numeric" min="0" step="1"></label>
      <div class="settings-actions"><button id="cancelSettingsBtn" class="secondary-btn">キャンセル</button><button id="saveSettingsBtn" class="primary-btn">保存</button></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
